replicaCount: 2
revisionHistoryLimit: 3

image:
  repository: ghcr.io/trussiumhq/trussium
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-credentials
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9000
  annotations: {}

runtime:
  environment: production
  host: 0.0.0.0
  port: 9000
  gracefulShutdownSeconds: 30
  capabilityAvailabilityTimeoutSeconds: 1

timeouts:
  providerRequestSeconds: 60
  streamIdleSeconds: 30

readiness:
  dependencyChecksEnabled: false
  dependencyTimeoutSeconds: 1
  dependencyCacheSeconds: 10
  requiredModel: ""

observability:
  metrics:
    enabled: true
  tracing:
    enabled: false
    serviceName: trussium
    sampleRatio: 1.0
    otlpTracesEndpoint: http://127.0.0.1:4318/v1/traces
    otlpExportTimeoutSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60

providerSecret:
  name: trussium-provider
  optional: true

extraConfig: {}
extraEnv: []
extraEnvFrom: []

startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30

livenessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

terminationGracePeriodSeconds: 36

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
