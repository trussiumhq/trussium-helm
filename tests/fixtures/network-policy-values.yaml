networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
    ports:
      - port: 9000
        protocol: TCP
  egress:
    to:
      - ipBlock:
          cidr: 203.0.113.0/24
    ports:
      - port: 443
        protocol: TCP
    dns:
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
