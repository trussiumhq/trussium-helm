name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Quality and Helm Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run strict MyPy
        run: uv run mypy tests

      - name: Run Pytest
        run: uv run pytest

      - name: Validate Helm rendering
        run: scripts/helm-validate.sh

      - name: Validate packaged chart
        run: scripts/chart-package.sh

  kind:
    name: Kind Lifecycle Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout chart repository
        uses: actions/checkout@v4

      - name: Checkout compatible Trussium runtime
        uses: actions/checkout@v4
        with:
          repository: trussiumhq/trussium
          ref: v0.24.0
          path: runtime

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: trussium-helm-ci
          wait: 60s

      - name: Run Helm lifecycle smoke test
        run: scripts/chart-smoke-test.sh
        env:
          TRUSSIUM_KIND_CLUSTER: trussium-helm-ci
          TRUSSIUM_RUNTIME_SOURCE: ${{ github.workspace }}/runtime
