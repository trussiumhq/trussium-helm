[project]
name = "trussium-helm"
version = "0.5.0"
description = "Development tooling for the official Trussium Helm chart."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "python-semantic-release>=10.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.12.5",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
exclude = [".venv", "dist"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["charts/trussium/Chart.yaml:version"]
branch = "main"
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
build_command = """
uv lock
git add uv.lock
scripts/chart-package.sh
"""

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/trussium-*.tgz"]
upload_to_vcs_release = true
