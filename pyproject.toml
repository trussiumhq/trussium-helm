[project]
name = "trussium-helm"
version = "1.3.0"
description = "Development tooling for the official Trussium Helm chart."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "python-semantic-release>=10.0.0",
]

[tool.uv]
package = false

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["charts/trussium/Chart.yaml:version"]
branch = "main"
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = true
build_command = """
uv lock
git add uv.lock
scripts/chart-package.sh
"""

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/trussium-*.tgz"]
upload_to_vcs_release = true
